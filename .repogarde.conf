# Règles repogarde du projet (hooks et CI) — voir CONTRIBUTING.md
[repogarde]
    # Flux : le travail s'intègre dans develop, livré sur main par PR
    integrationBranch = develop
    protectedBranches = main develop
    allowedBranches = main develop release/* release-please--* dependabot/* renovate/*
    # Outils du projet (formatage Spotless, build et tests Maven)
    format = ./scripts/format.sh
    test = ./scripts/check.sh --if-changed   # fichiers modifiés sur stdin
    # Publication soumise à approbation (bin/proteger)
    environment = production
