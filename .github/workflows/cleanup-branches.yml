name: cleanup-branches

# Supprime la branche d'une PR fusionnée : le dépôt ne garde que main, develop et le travail en cours.
# Une branche encore source d'une autre PR ouverte est conservée (release/* et hotfix/* ont deux PR).
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: github.event.pull_request.merged && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Supprimer la branche fusionnée
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$BRANCH" in main|develop) echo "Branche permanente '$BRANCH' conservée."; exit 0 ;; esac

          open=$(gh pr list -R "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq 'map("#\(.number)")|join(" ")')
          if [ -n "$open" ]; then
            echo "::notice::'$BRANCH' conservée : encore utilisée par $open"; exit 0
          fi

          if gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$BRANCH" 2>/dev/null; then
            echo "::notice::Branche '$BRANCH' supprimée"
          else
            echo "Branche '$BRANCH' déjà supprimée."
          fi
