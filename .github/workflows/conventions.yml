name: conventions

# Rejoue côté GitHub les règles des hooks locaux (.githooks), contournables avec --no-verify.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Nom et cible de la branche
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          pattern='^((feature|fix|refactor|chore|docs|test|hotfix)/[a-z0-9._-]+|release/[0-9]+\.[0-9]+\.[0-9]+|develop)$'
          if ! [[ "$HEAD" =~ $pattern ]]; then
            echo "::error::Nom de branche invalide : '$HEAD' (voir CONTRIBUTING.md)"; exit 1
          fi
          case "$HEAD" in
            release/*|hotfix/*) allowed='main develop' ;;
            develop)            allowed='main' ;;
            *)                  allowed='develop' ;;
          esac
          if ! [[ " $allowed " == *" $BASE "* ]]; then
            echo "::error::'$HEAD' ne peut pas fusionner dans '$BASE' (autorisé : $allowed)"; exit 1
          fi

      - name: Titre de la PR
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          printf '%s\n' "$TITLE" > /tmp/title
          bash .githooks/commit-msg /tmp/title

      - name: Messages de commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          status=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            bash .githooks/commit-msg /tmp/msg || { echo "::error::Commit $sha invalide"; status=1; }
          done
          exit $status
