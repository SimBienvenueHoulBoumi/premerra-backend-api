name: tag

# Crée le tag vX.Y.Z sur main à partir des commits depuis le dernier tag (scripts/next-version.sh) :
#   type! ou BREAKING CHANGE → MAJOR, feat → MINOR, fix/perf → PATCH, autres types → pas de tag.
# Puis construit le jar à cette version et publie la GitHub Release.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tag
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Calculer la version
        id: version
        run: |
          version=$(./scripts/next-version.sh HEAD)
          [ -n "$version" ] || exit 0
          # Notes calculées avant de poser le tag (après, elles partiraient du nouveau tag)
          ./scripts/release-notes.sh HEAD > "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "::notice::v$version"

      - uses: actions/setup-java@v6
        if: steps.version.outputs.version
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build et tests
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./mvnw -B -ntp verify -Drevision="$VERSION"

      - name: Tag et release
        if: steps.version.outputs.version
        env:
          TAG: v${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" target/*.jar --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
